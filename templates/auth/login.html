{% extends 'base.html' %}
{% block title %}Sign in · EMP{% endblock %}
{% block content %}
<section class="form-panel">
  <h1 class="h3 mb-3">Sign in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" maxlength="254" autocomplete="username" value="{{ request.form.get('email', '') }}" required></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required></div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="mt-4 mb-1">Create an account:</p>
  <a href="{{ url_for('auth.register_student') }}">Student registration</a> · <a href="{{ url_for('auth.register_examiner') }}">Examiner registration</a>
</section>
{% endblock %}
